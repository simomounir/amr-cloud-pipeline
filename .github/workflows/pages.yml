name: Pages

# The site shows the dataset release named in dashboard/dataset.txt, so publishing a dataset is a
# commit (scripts/publish-dataset.sh) and every deployed site matches a commit. Pages identifies a
# deployment by its commit: a release-triggered redeploy of an unchanged commit kept serving the
# old files (2026-10-09).
on:
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

# Build runs npm ci (third-party code), so it gets no OIDC token: AWS trusts any token from
# main of this repository. Only the deploy job, with its own environment, gets one.
permissions:
  contents: read
  pages: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Download the pinned dataset release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(tr -d '[:space:]' < dashboard/dataset.txt)
          [[ "$tag" =~ ^dataset-[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::dashboard/dataset.txt must name a dataset-YYYY-MM-DD release"; exit 1; }
          mkdir -p dashboard/public/data
          gh release download "$tag" --dir dashboard/public/data --pattern '*.parquet' --pattern manifest.json
          echo "$tag" > dashboard/public/data/TAG
      - name: Build
        working-directory: dashboard
        run: npm ci && npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
